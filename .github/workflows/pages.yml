# Tests the app, then publishes the public/ folder to GitHub Pages.
#
# One-time setup: in the repository on GitHub, open Settings → Pages and, under "Build and
# deployment", set Source to "GitHub Actions". After that, every change merged into main is
# tested and then published automatically. The site's address is shown on that settings page.
#
# On a pull request only the tests run; nothing is published until the change reaches main.

name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Two jobs, as in GitHub's own Pages template: the upload is made in one job and deployed in the
  # next. Deploying in the same job as the upload can fail because the new upload is not listed yet.
  # Each attempt's upload has its own name, so a re-run cannot find two with the same name.
  build-site:
    name: Package the site
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}

  publish:
    name: Publish to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Removes the records of earlier publishes that failed, so the repository's "Deployments" panel
  # does not keep showing an old red cross after the site has been published successfully.
  # Only deployments whose latest status is a failure or error are touched; the live one never is.
  # A problem here must not make a good publish look failed, hence continue-on-error.
  tidy-deployments:
    name: Remove failed deployment records
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, { owner, repo, environment: 'github-pages', per_page: 100 });
            for (const d of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
              const latest = statuses[0];
              if (!latest || !['failure', 'error'].includes(latest.state)) continue;
              await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: d.id, state: 'inactive' });
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
              core.info(`Removed failed deployment ${d.id} (commit ${d.sha.slice(0, 7)}).`);
            }
